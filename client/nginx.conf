server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths load index.html so React Router can handle them
  location / {
    try_files $uri /index.html;
  }

  # Forward API calls to the Node server
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
  }
}
