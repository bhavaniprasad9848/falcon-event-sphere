# Run everything:        docker compose up --build
# Load demo events:      docker compose exec server npm run seed
# Then open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/falcon_events
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      CLIENT_ORIGIN: http://localhost:8080
      # Optional: set in a .env file next to this one to turn on AI recommendations
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - mongo
    ports:
      - "4000:4000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
